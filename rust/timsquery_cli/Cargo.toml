[package]
name = "timsquery_cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
timsquery = { path = "../timsquery" }
timscentroid = { path = "../timscentroid" }

# Workspace-inherited deps from the original main.rs
clap = { workspace = true, features = ["derive"] }
timsrust = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rayon = { workspace = true }
half = { workspace = true }
thiserror = { workspace = true } # User requested

[dev-dependencies]
tempfile = { workspace = true }

# Not using mimalloc on windows makes everything extremely slow; musl's own
# allocator serialises every allocation on one lock, which dominates a
# rayon-parallel run. Keep this cfg identical to the gate in src/main.rs.
[target.'cfg(any(target_os = "windows", target_env = "musl"))'.dependencies]
mimalloc = { workspace = true }
