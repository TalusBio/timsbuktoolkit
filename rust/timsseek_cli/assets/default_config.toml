# timsseek default configuration.
#
# Every section is optional unless explicitly noted — omitted sections fall back
# to the values shown here. Unknown fields are rejected to catch typos early.
#
# Dump this file at any time with:
#     timsseek --write-default-config <path>
# or:
#     timsseek --print-default-config
#
# The CLI also accepts JSON configs; TOML is preferred for hand-authored ones.

## Input spectral library (optional — `--speclib-uri` overrides this).
# [input]
# type = "speclib"
# uri = "path/to/library.msgpack.zst"


[analysis]
## Number of peptides scored per chunk. Bigger = more parallelism, more RAM.
chunk_size = 20000

## Decoy generation strategy.
## "if_missing"  — generate ±12 Da mass-shift decoys when the library has none
## "always"      — always generate decoys (replace any existing ones)
## "never"       — trust the library's decoy labels
decoy_strategy = "if_missing"

## Rescore model applied in Phase 5 (`--rescore-model` overrides this).
## "gbm"        — cross-validated gradient-boosted trees (default)
## "lda"        — Sage-style shrinkage LDA on the linear lane. The cheapest and
##                the least sensitive by a wide margin; both gaps GROW with the
##                candidate count.
## "hybrid"     — cross-fit LDA score folded into the GBM feature frame
## "mlp"        — small MLP on the linear lane (the same features as "lda")
## "mlp_all"    — small MLP on the full lane (the same features as "gbm")
## "hybrid_mlp" — cross-fit MLP score folded into the GBM feature frame
##
## COST: THERE IS NO SINGLE MULTIPLIER FOR ANY OF THESE. Every ratio below moves
## with the candidate count, in both directions and by more than 2x, so a bare
## "~Nx cheaper" is wrong at every scale but one — which is how each earlier
## version of this note went stale. Anchors, so you can interpolate; Phase 5 wall
## time / targets at 1% FDR, two runs of one Astral mzML:
##
##                    114,138 candidates        2,174,837 candidates
##   lda                0.476s / 24141             9.667s / 102843
##   hybrid             3.455s / 24407           148.062s / 110425
##   mlp                6.141s / 25077           323.012s / 125242  <- OLD DEFAULTS
##   mlp_all            7.342s / 25451           281.953s / 134655
##   gbm                9.588s / 25240           574.315s / 134710
##   hybrid_mlp        11.258s / 25454           773.560s / 133977  <- OLD DEFAULTS
##
## Every 114k number is at the CURRENT MLP defaults. The two marked OLD DEFAULTS
## are not: "mlp" and "hybrid_mlp" have not been re-timed at 2.17M since the MLP
## hyperparameter retune, which more than halved both of their 114k times, so treat
## those two cells as loose upper bounds rather than current cost. "lda", "hybrid"
## and "gbm" do not use the MLP at all, so the retune cannot have moved them.
##
## SPEED RATIOS GROW WITH SCALE. "lda" is ~20x cheaper than "gbm" at 114k
## candidates, ~59x at 2.17M, and ~100x on a ~28M-entry library measured earlier
## in a different regime. "hybrid" is ~0.36x "gbm"'s Phase 5 time at 114k and
## ~0.26x at 2.17M. "mlp_all" is 1.31x faster than "gbm" at 114k and 2.04x at
## 2.17M — and at the pre-retune MLP defaults that same variant was 1.7x SLOWER at
## 114k, so this comparison changes sign with BOTH library size and tuning. "mlp"
## is the clearest case: 1.5x slower than "gbm" at 114k before the retune, 1.56x
## faster at the same scale after it.
##
## THE SENSITIVITY COST GROWS WITH SCALE TOO, and it is the bigger trap: "lda"
## gives up 4.4% of "gbm"'s targets at 114k candidates but 23.7% at 2.17M;
## "hybrid" 3.3% then 18.0%. Choosing "lda" for speed on a large library costs
## several times what a small test run will show you. The MLP variants are the
## exception measured so far: "mlp_all" is +211 targets at 114k and -55 (-0.04%) at
## 2.17M, and "hybrid_mlp" is +214 at 114k, the most of any option there.
##
## Caveats on every number above:
##   * both runs are the same FAIMS acquisition (NO ion mobility), so 25 of the
##     101 linear and 27 of the 128 all-lane columns were culled as dead. A TIMS
##     run exercises more features and may time differently.
##   * two datasets, one machine — orders of magnitude and directions of movement,
##     not a benchmark suite.
##   * Phase 5 is a fraction of a whole search, so 2x there is not 2x end to end.
rescore_model = "gbm"


## Extraction tolerances for the broad first-pass scoring (pre-calibration).
## Each field is an externally-tagged enum:
##   ms       : { Ppm = [left, right] } | { Absolute = [left, right] }
##   mobility : { Pct = [left, right] } | { Absolute = [left, right] }
##   quad     : { Absolute = [left, right] }
##   rt       : "Unrestricted" | { Minutes = [before, after] }
[analysis.tolerance]
ms       = { Ppm = [15.0, 15.0] }
mobility = { Pct = [5.0, 5.0] }
quad     = { Absolute = [0.1, 0.1] }
rt       = "Unrestricted"


[calibration]
## Number of top-scoring calibrants retained from Phase 1 (used to fit the RT
## curve and measure mass/mobility offsets).
n_calibrants = 2000

## Grid resolution for the RT calibration pathfinding.
grid_size = 100

## DP lookback width during pathfinding (larger = smoother curve, slower fit).
dp_lookback = 30

## Tolerance-derivation sigma multipliers; `1.4826 * MAD` is the robust stdev
## stand-in. mz_sigma / mobility_sigma give median-offset bounds
## (`median ± sigma * 1.4826 * MAD`, asymmetric); rt_sigma_factor is a plain
## half-width with NO median offset, floored by `min_rt_tolerance_minutes`.
## mz_sigma 3.0 over 1.5: +12.6% sensitivity on an Astral run.
mz_sigma                 = 3.0
mobility_sigma           = 3.0
rt_sigma_factor          = 3.0

## Floor for the derived RT tolerance. Prevents pathologically tight windows
## on well-calibrated runs.
min_rt_tolerance_minutes = 0.5

## Per-calibrant RT aggregation window used when measuring mass/mobility
## offsets at the Phase-1 apex. Narrow (a handful of cycles) isolates the
## peak from neighbors; wider admits contamination into the stats.
calibration_query_rt_window_minutes = 0.083333336   # 5 seconds (5 / 60)


## Output directory (optional — `--output-uri` overrides this).
# [output]
# uri = "./results"


## Staging controls for S3/remote raw inputs (all optional).
## Tempdirs are created under `tempdir_root` (system temp when unset);
## remote prefixes are capped at `max_prefix_keys` keys; `save_sidecar`
## persists a `.idx` next to the input so repeat runs skip the build;
## `stale_sweep_age_hours` reclaims leaked tempdirs from prior crashes.
# [staging]
# tempdir_root = "/scratch/timsseek"
# max_prefix_keys = 256
# save_sidecar = false
# stale_sweep_age_hours = 24
