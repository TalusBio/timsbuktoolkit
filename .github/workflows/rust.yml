name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""                       # default (rayon on for timsseek)
          - "--no-default-features"  # serial
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          # Per leg: the two resolve different features and would thrash one entry.
          cache-key: ${{ matrix.features }}
          # This action defaults to `-D warnings`; `task clippy` owns that.
          rustflags: ''
      - name: Build
        run: cargo build --verbose -p timsseek ${{ matrix.features }}
      - name: Run tests
        run: cargo test --verbose -p timsseek ${{ matrix.features }}
      # timsseek alone misses timscentroid's mzdata ingest, tims_stage staging
      # and the timsquery mobility gate.
      - name: Run reader + staging tests (mzdata)
        if: matrix.features == ''
        run: |
          cargo test -p timscentroid --features mzdata
          cargo test -p tims_stage -p timsquery

  # Crates the timsseek matrix above never compiles. `--all-targets` so examples
  # are built too — that is what let `timsseek_cli/examples/load_bench.rs` rot.
  cli-and-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          # Bump when the `-p` list changes: the key ignores it, so a widened
          # build hits the old key and rust-cache saves nothing.
          cache-key: pkgs-cli-sim-viewer
          # This action defaults to `-D warnings`; `task clippy` owns that.
          rustflags: ''
      - name: Build
        run: cargo build --verbose -p timsseek_cli -p apex_sim -p timsseek_macros -p rescore_dash -p timsquery_viewer
      - name: Run tests
        run: cargo test --verbose -p timsseek_cli -p apex_sim -p timsseek_macros -p rescore_dash -p timsquery_viewer --all-targets
      # Opt-in, so these call sites compile under no other leg.
      - name: Type-check (dashboard feature)
        run: cargo check -p timsseek_cli --features dashboard --all-targets
      # calibrt compiles in every leg but nothing above runs its tests, and
      # calib_dash is built by no other leg at all. The feature leg is the only
      # one that compiles `calib_dash_hook`'s real arm.
      - name: Run calibrt / calib_dash tests
        run: cargo test --verbose -p calibrt -p calib_dash
      - name: Check timsseek_cli with the calib-dashboard feature
        run: cargo check --verbose -p timsseek_cli --features calib-dashboard --all-targets
