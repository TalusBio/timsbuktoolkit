# timsseek default configuration.
#
# Every section is optional unless explicitly noted -- omitted sections fall back
# to the values shown here. Unknown fields are rejected to catch typos early.
#
# Dump this file at any time with:
#     timsseek --write-default-config <path>
# or:
#     timsseek --print-default-config
#
# The CLI also accepts JSON configs; TOML is preferred for hand-authored ones.

## Input spectral library (optional -- `--speclib-uri` overrides this).
# [input]
# type = "speclib"
# uri = "path/to/library.mzspeclib.txt.gz"


[analysis]
## Number of peptides scored per chunk. Bigger = more parallelism, more RAM.
chunk_size = 20000

## Decoy generation strategy.
## "if_missing"  -- generate ±CH2 mass-shift decoys when the library has none
## "force"       -- always generate decoys (replace any existing ones)
## "never"       -- trust the library's decoy labels, generating none even when
##                 the library ships none, which leaves FDR estimated from no decoys
decoy_strategy = "if_missing"

## What to do with a library peak that carries no annotation, and so no
## theoretical m/z. Read only for a library that annotates nothing at all,
## "keep_all" aside: a bare peak beside annotated ones is mzPAF's "?", which is
## the writer calling it noise, and those are always dropped.
## "keep"     -- store it at the m/z the file measured, under a "?N" label
## "skip"     -- drop it; a library that annotates nothing then has no fragments
##               left and is refused as unsearchable
## "fail"     -- refuse the library at the first one
## "keep_all" -- store every peak that way, annotated or not, discarding the
##               annotations the file did carry
##
## A kept peak is at an observed mass where an annotated one is at a theoretical
## mass, and calibration fits its m/z offsets assuming the latter.
unannotated_peaks = "keep"

## Rescore model applied in Phase 5 (`--rescore-model` overrides this).
## "gbm"        -- cross-validated gradient-boosted trees
## "lda"        -- Sage-style shrinkage LDA on the linear lane
## "hybrid"     -- cross-fit LDA score folded into the GBM feature frame
## "mlp"        -- small MLP on the full lane (default; same features as "gbm")
##
## Runtime and sensitivity differences are scale- and dataset-dependent; benchmark
## representative inputs rather than relying on a fixed multiplier.
rescore_model = "mlp"


## Extraction tolerances for the broad first-pass scoring (pre-calibration).
## Each field is an externally-tagged enum:
##   ms       : { Ppm = [left, right] } | { Absolute = [left, right] }
##   mobility : "Unrestricted" | { Pct = [left, right] } | { Absolute = [left, right] }
##   quad     : { Absolute = [left, right] }
##   rt       : "Unrestricted" | { Minutes = [before, after] } | { Pct = [before, after] }
[analysis.tolerance]
ms       = { Ppm = [15.0, 15.0] }
mobility = "Unrestricted"
quad     = { Absolute = [0.1, 0.1] }
rt       = "Unrestricted"


[calibration]
## Number of top-scoring calibrants retained from Phase 1 (used to fit the RT
## curve and measure mass/mobility offsets).
n_calibrants = 2000

## Grid resolution for the RT calibration pathfinding.
grid_size = 100

## DP lookback width during pathfinding (larger = smoother curve, slower fit).
dp_lookback = 30

## Tolerance-derivation sigma multipliers; `1.4826 * MAD` is the robust stdev
## stand-in. mz_sigma / mobility_sigma give median-offset bounds
## (`median ± sigma * 1.4826 * MAD`, asymmetric); rt_sigma_factor is a plain
## half-width with NO median offset, floored by `min_rt_tolerance_minutes`.
## mz_sigma 3.0 over 1.5: +12.6% sensitivity on an Astral run.
mz_sigma                 = 3.0
mobility_sigma           = 3.0
rt_sigma_factor          = 3.0

## Floor for the derived RT tolerance. Prevents pathologically tight windows
## on well-calibrated runs.
min_rt_tolerance_minutes = 0.5

## Per-calibrant RT aggregation window used when measuring mass/mobility
## offsets at the Phase-1 apex. Narrow (a handful of cycles) isolates the
## peak from neighbors; wider admits contamination into the stats.
calibration_query_rt_window_minutes = 0.083333336   # 5 seconds (5 / 60)


## Sequence database this run belongs to (optional -- `--fasta` overrides this).
## Separate from `[library]` below, which says how to predict a library: the
## sequences are wanted on runs that predict nothing, and a library does not
## stand in for the database it was digested from. Local paths only.
# [sequences]
# fasta = "path/to/proteome.fasta"


## Output directory (optional -- `--output-uri` overrides this).
# [output]
# uri = "./results"


## How to predict a library, consulted by `timsseek build-library`. Every field
## is optional and falls through to msspeculator's own default, so the section
## can be omitted entirely; a build flag beats whatever is set here.
# [library]
# model = "builtin:small-v0"
# missed_cleavages = 2
# min_length = 7
# max_length = 30
# min_charge = 2
# max_charge = 4
# fixed_mods = ["C[UNIMOD:4]"]
# variable_mods = ["M[UNIMOD:35]"]
# max_variable_mods = 1
# min_intensity = 0.01
# max_fragments = 20
# decoys = true
## Acquisition and chromatography context are not settable: a build uses the
## model artifact's own defaults. Choosing a different one is a decision about
## the model, made by `model` above.


## Centroiding overrides for the index built from a raw file (all optional).
## Each MS level starts from the library default and takes only the fields
## named here. Two caps bound stored centroids per frame, and so index memory
## at 16 bytes per peak:
##   max_peaks   -- whole-frame cap; the most intense centroids anywhere win,
##                  so a dense m/z region can starve a sparse one.
##   window_cap  -- per-window cap; the `max_peaks` most intense centroids in
##                  each `window_da` slice survive, so coverage is even across
##                  the spectrum and the bound is `windows * max_peaks`.
## A cached `.idx` was built with whatever config it records and ignores this
## section.
## Tolerances take one of two units each. Raw peaks are line spectra with one
## integer TOF index per ion per scan, and a TOF bin is 2.4-7 ppm wide, so an
## m/z tolerance is most naturally a bin count. `{ Bins = 0 }` merges identical
## indices only and is the default; `{ Bins = 1 }` also merges the same ion when
## two scans quantized it to neighboring bins, which measured worse for both
## IDs and isotope-envelope fidelity on the runs tried so far. A `{ Ppm = x }`
## value is converted per peak and rounded, so anything under half a bin is
## `Bins = 0` spelled expensively. Mobility is a true profile across scans;
## `{ Pct = 3.0 }` of 1/K0 or `{ Scans = 20 }`.
## `rt_range_seconds` indexes only that slice of the run, for fast benchmark
## iteration; a sliced index is never cached as the run's `.idx`.
# [indexing]
# rt_range_seconds = [600.0, 720.0]
## `ignore_mobility` treats the run as having no mobility axis: no mobility
## filter in any phase and no mobility score features. An ablation knob.
# ignore_mobility = false
# [indexing.ms1]
# max_peaks = 20000
# mz_tol = { Bins = 0 }
# im_tol = { Pct = 2.0 }
# early_stop_iterations = 200
# window_cap = { max_peaks = 1000, window_da = 100.0 }
# [indexing.ms2]
# max_peaks = 50000
# mz_tol = { Bins = 0 }
# im_tol = { Pct = 3.0 }
# early_stop_iterations = 0
# window_cap = { max_peaks = 1000, window_da = 100.0 }
## Whether a peak already absorbed into a cluster may recruit its own
## neighbors (transitive growth). `false` bounds a cluster to the parent's
## tolerance box, which matters once `mz_tol` reaches a whole bin.
# transitive = true


## Staging controls for S3/remote raw inputs (all optional).
## Tempdirs are created under `tempdir_root` (system temp when unset);
## remote prefixes are capped at `max_prefix_keys` keys; `save_sidecar`
## persists a `.idx` next to the input so repeat runs skip the build;
## `stale_sweep_age_hours` reclaims leaked tempdirs from prior crashes.
# [staging]
# tempdir_root = "/scratch/timsseek"
# max_prefix_keys = 256
# save_sidecar = false
# stale_sweep_age_hours = 24

[indexing]
ignore_mobility = true

[indexing.ms1]
im_tol = { Pct = 4.0 }

[indexing.ms2]
window_cap = { max_peaks = 500, window_da = 50.0 }
im_tol = { Pct = 5.0 }
