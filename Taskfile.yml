version: "3"

interval: 100ms

includes:
  timsseek: ./rust/timsseek

tasks:
  ci:
    cmds:
      - task: fmt:check
      - task: clippy
      - task: test
      - task: doc
      - task: license_check

  # Mirrors the `cargo-deny` CI job. Needs cargo-deny >= 0.16: older builds
  # cannot parse CVSS 4.0 entries and die on the advisory database itself.
  license_check:
    cmds:
      - cargo deny check

  test:
    cmds:
      - task: test:rust
      - task: test:python

  test:rust:
    cmds:
      - cargo test -- --nocapture
      # Not a default member — that keeps ratatui out of a plain `cargo build`.
      - cargo test -p rescore_dash -- --nocapture

  test:python:
    cmds:
      - uv run --locked python -m pytest

  fmt:
    cmds:
      - cargo +nightly fmt --all --verbose
      - uv run --locked ruff format

  fmt:check:
    cmds:
      - cargo +nightly fmt --all -- --check
      - uv run --locked ruff format --check

  clippy:
    cmds:
      - cargo clippy --all-targets --no-deps {{.CLI_ARGS}} -- -D warnings
      # rescore_dash is outside Cargo's default members.
      - cargo clippy -p rescore_dash --all-targets -- -D warnings
      # dashboard.rs only exists under the opt-in feature.
      - cargo clippy -p timsseek_cli --features dashboard --all-targets -- -D warnings

  clippy:fix:
    cmds:
      - cargo clippy --fix --allow-dirty --allow-staged {{.CLI_ARGS}} -- -D warnings
      - cargo clippy -p rescore_dash --all-targets -- -D warnings
      - cargo clippy -p timsseek_cli --features dashboard --all-targets -- -D warnings

  # Keep workspace documentation warning-free.
  doc:
    cmds:
      - RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  todos:
    cmds:
      - grep -nH -R TODO rust/tims*/src
      - grep -nH -R "todo!" rust/tims*/src

  build_python:
    cmds:
      - uv build --all-packages --verbose

  bumpver:
    cmds:
      # --tag {alpha, beta, dev, rc, post, final}
      - uv run --dev  bumpver update --minor --allow-dirty --no-commit
      - cargo b
      - uv lock

  docker:
    cmds:
      # - cargo install cross --git https://github.com/cross-rs/cross
      - cross build --release --target x86_64-unknown-linux-gnu --bin timsquery_cli
      - cross build --release --target x86_64-unknown-linux-gnu --bin timsseek
      - docker build --platform linux/amd64 -t timsseek:local .

